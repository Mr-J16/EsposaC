<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Cinthia 🌻</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Great+Vibes&family=Montserrat:wght@300;500;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root{--gold:#fbbf24;--ink:#fff4d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;background:#150f2a;color:var(--ink);font:300 17px/1.7 Montserrat,system-ui,sans-serif}
.sky{position:fixed;inset:0}
#dusk{background:linear-gradient(#0f0a24,#2e1a4a 50%,#7c3a2a)}
#dawn{background:linear-gradient(#fde68a,#fbbf24 55%,#fb923c);opacity:0}
canvas{position:fixed;inset:0;width:100%;height:100%}
main{position:fixed;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none}
.card{pointer-events:auto;width:min(100%,540px);max-height:100%;overflow:auto;text-align:center;padding:32px 26px 22px;border-radius:28px;background:rgba(20,12,44,.55);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border:1px solid rgba(253,224,71,.25);box-shadow:0 30px 80px rgba(0,0,0,.35);transition:background 3s,opacity .6s,transform .6s}
body.dawn .card{background:rgba(120,53,15,.5);border-color:rgba(255,255,255,.4)}
body.peek .card{opacity:0;transform:scale(.96);pointer-events:none}
#body{transition:opacity .45s,transform .45s}#body.out{opacity:0;transform:translateY(10px)}
h1,h2,.gold{font-family:'Great Vibes',cursive;font-weight:400;margin:.15em 0;line-height:1.1}
h1{font-size:clamp(50px,14vw,72px);color:#fda4af}
h2{font-size:clamp(30px,8vw,42px)}
.gold{background:linear-gradient(120deg,#fde047,#fbbf24,#fff7ad,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
small{display:block;letter-spacing:.24em;text-transform:uppercase;font-size:11px;font-weight:500;color:#fcd34d}
.sub,.it,.q{font-family:'Playfair Display',serif;font-style:italic}
.q{font-size:1.22em;color:#fde68a}.q b{color:#fda4af;font-weight:500}
.ask,.big{font:600 clamp(24px,6.4vw,30px)/1.35 'Dancing Script',cursive;color:#fef3c7}
p{margin:.7em 0}.sig{font-size:14px;opacity:.85}
.btn{margin:10px 4px 0;padding:14px 28px;border:0;border-radius:99px;font:600 15px Montserrat,sans-serif;letter-spacing:.04em;color:#451a03;background:linear-gradient(120deg,#fde047,#fbbf24,#f59e0b);box-shadow:0 8px 30px rgba(251,191,36,.45);cursor:pointer;transition:transform .2s}
.btn:active{transform:scale(.96)}.btn.soft{background:rgba(255,255,255,.16);color:var(--ink);box-shadow:none}
.dots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);transition:.4s}
.dots i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
#hold{--p:0;position:relative;width:128px;height:128px;margin-top:10px;border:0;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*360deg),rgba(255,255,255,.18) 0);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:grid;place-items:center;transform:scale(calc(1 + var(--p)*.12));box-shadow:0 0 calc(18px + var(--p)*70px) rgba(251,191,36,.6)}
#hold::before{content:"";position:absolute;inset:9px;border-radius:50%;background:linear-gradient(145deg,#fde047,#f59e0b)}
#hold svg{position:relative;width:54px;fill:#9f1239;animation:beat 1.6s infinite}
.hint{font-size:14px;opacity:.85}
.beat{width:46px;fill:#fb7185;filter:drop-shadow(0 0 10px #fb7185);animation:beat .86s infinite}
@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.22)}20%{transform:scale(1)}30%{transform:scale(1.15)}45%{transform:scale(1)}}
.fab{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5;border:0;border-radius:99px;padding:9px 14px;background:rgba(20,12,44,.55);color:var(--ink);font:500 13px Montserrat,sans-serif;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer}
#mute{right:12px}#peek{left:12px;display:none}body.dawn #peek{display:block}
@media(prefers-reduced-motion:reduce){#hold svg,.beat{animation:none}}
</style>
</head>
<body>
<div class="sky" id="dusk"></div><div class="sky" id="dawn"></div>
<canvas id="cv"></canvas>
<main><section class="card"><div id="body"></div><div id="ctl"></div><div class="dots" id="dots"></div></section></main>
<button class="fab" id="mute" aria-label="Sonido">🔊</button>
<button class="fab" id="peek">Ver el jardín 🌻</button>
<script>
const $=id=>document.getElementById(id),R=Math.random,RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cv=$('cv'),ctx=cv.getContext('2d');
const HEART='<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.600 1 5.600 3 2-2 3.600-3 5.600-3 3.400 0 5.500 3.400 4 6.800C19.500 16.400 12 21 12 21z"/></svg>';

/* ---------- Pantallas ---------- */
const S=[
{h:`<small>Un mensaje escrito con el alma</small><h1>Para mi Cinthia</h1><p class="sub">el amor de mi vida y madre de nuestra hija</p><p class="hint">🎵 Sube el volumen</p>`,b:'Abrir mi carta'},
{h:`<p>Mirar hacia atrás y recordar todos los años que hemos compartido llena mi alma de una gratitud infinita. Gracias por cada sonrisa, por cada abrazo cálido en los días oscuros, por tu paciencia infinita y por construir a mi lado este amor puro y verdadero.</p>`,b:'Continuar'},
{h:`<p class="q">“Hoy mi corazón late más fuerte que nunca, porque dentro de ti, <b>Cinthia</b>, llevas la bendición más grande de nuestras vidas: <b>nuestra amada hija</b>.”</p>`,b:'Continuar'},
{h:`<p>Verte llevarla en tu vientre con tanta delicadeza, valentía y amor me hace admirarte cada segundo más. Gracias por regalarme el sueño de ser papá y por convertirte en la madre maravillosa que nuestra pequeña tendrá la dicha de tener.</p>`,b:'Continuar'},
{h:`<h2>Tengo una pregunta muy especial para ti…</h2><p class="ask">¿Aceptas seguir caminando de la mano conmigo por siempre, llenando la vida de nuestra hija de amor, felicidad y miles de flores amarillas?</p>`,hold:1},
{h:`<svg class="beat" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.4 5c2 0 3.600 1 5.600 3 2-2 3.600-3 5.600-3 3.400 0 5.500 3.400 4 6.800C19.500 16.400 12 21 12 21z"/></svg><small>el latido de nuestra hija</small><h2 class="gold" style="font-size:clamp(38px,10vw,54px)">¡Para Ti, Mi Flor Más Hermosa!</h2><p class="it">Que estas flores amarillas iluminen siempre tu camino y el de nuestra hermosa hija.</p><p>Prometo cuidarte, amarte y respetarte cada uno de mis días. Prometo ser el mejor compañero para ti y el mejor padre para nuestra pequeña princesa.</p><p class="big">¡Las amo infinitamente a las dos!</p><p class="sig">— Con todo mi corazón, para mi Cinthia 💛</p>`,fin:1}
];
let cur=0,prog=0,holding=0,fin=0,light=0,lastN=0;
const HOLD=`<button id="hold" aria-label="Mantén presionado para decir que sí">${HEART}</button><p class="hint">Mantén presionado para decir <b>que sí</b></p>`;
const FIN=`<button class="btn" id="rain">🌸 Lluvia de pétalos</button><button class="btn soft" id="again">🌻 Más flores</button><p class="hint">Toca el cielo para plantar tus propias flores</p>`;

function go(i){
  cur=i;$('body').classList.add('out');
  setTimeout(()=>{
    const s=S[i];$('body').innerHTML=s.h;
    $('ctl').innerHTML=s.hold?HOLD:s.fin?FIN:`<button class="btn" id="nx">${s.b}</button>`;
    $('dots').innerHTML=S.slice(0,5).map((_,k)=>`<i class="${k<=Math.min(i,4)?'on':''}"></i>`).join('');
    $('body').classList.remove('out');
    const nx=$('nx');if(nx)nx.onclick=()=>{if(cur==0)startMusic();go(cur+1)};
    if(s.fin){$('rain').onclick=rain;$('again').onclick=()=>{bloomMore();tone(f(PENT[(R()*6)|0]+12),.08,2)}}
  },i?450:0);
}

/* ---------- Música generativa (Web Audio) ---------- */
const PENT=[0,2,4,7,9,12,14,16,19,24];
const CH=[[0,4,7,11],[-3,0,4,7],[-7,-3,0,4],[-5,-1,2,7]],PAT=[0,1,2,3,2,1,2,3];
let A,master,muted=false,step=0;
const f=s=>261.63*2**(s/12);
function startMusic(){
  if(A)return;A=new(window.AudioContext||window.webkitAudioContext)();master=A.createGain();master.gain.value=.55;
  const conv=A.createConvolver(),n=A.sampleRate*2.5|0,buf=A.createBuffer(2,n,A.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<n;i++)d[i]=(R()*2-1)*(1-i/n)**3}
  conv.buffer=buf;const wet=A.createGain();wet.gain.value=.5;
  master.connect(A.destination);master.connect(conv);conv.connect(wet);wet.connect(A.destination);
  setInterval(tick,430);tick();
}
function tone(fr,v=.07,d=2.2,when=0){
  if(!A)return;const t=A.currentTime+when;
  [[1,'sine',1],[2,'triangle',.22]].forEach(([m,ty,k])=>{
    const o=A.createOscillator(),g=A.createGain();o.type=ty;o.frequency.value=fr*m;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*k,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);
  });
}
function tick(){
  if(document.hidden)return;const ch=CH[(step/8|0)%4],i=step%8;
  tone(f(ch[PAT[i]]+12),.06,2.4);if(i==0)tone(f(ch[0]-12),.09,3.2);step++;
}
function chime(){PENT.forEach((s,i)=>tone(f(s),.09,2.6,i*.09))}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:.55};

/* ---------- Escena (canvas) ---------- */
let W=0,H=0,flowers=[],stars=[],ff=[],P=[];
const PALS=[['#c2610a','#fbbf24','#fde68a'],['#b45309','#f59e0b','#facc15'],['#ca8a04','#facc15','#fef08a']];
function sprite(p){
  const Z=220,c=document.createElement('canvas');c.width=c.height=Z;const g=c.getContext('2d');g.translate(Z/2,Z/2);const Rr=Z*.47;
  for(let L=0;L<2;L++){const n=17;for(let i=0;i<n;i++){
    g.save();g.rotate(i*2*Math.PI/n+(L?Math.PI/n:0));
    const len=Rr*(L?.88:1)*(.92+R()*.1),w=Rr*.2;
    g.beginPath();g.moveTo(0,0);g.bezierCurveTo(w*1.2,-len*.3,w*.9,-len*.8,0,-len);g.bezierCurveTo(-w*.9,-len*.8,-w*1.2,-len*.3,0,0);
    const gr=g.createLinearGradient(0,0,0,-len);gr.addColorStop(0,p[0]);gr.addColorStop(.5,p[L?0:1]);gr.addColorStop(1,p[L?1:2]);
    g.fillStyle=gr;g.fill();g.strokeStyle='rgba(146,64,14,.28)';g.lineWidth=1;g.stroke();g.restore();
  }}
  const cr=Rr*.34,gr=g.createRadialGradient(0,0,0,0,0,cr);gr.addColorStop(0,'#6b3410');gr.addColorStop(.75,'#3b1d08');gr.addColorStop(1,'#25120a');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,cr,0,7);g.fill();
  for(let i=1;i<100;i++){const r=cr*.96*Math.sqrt(i/100),a=i*2.39996;g.fillStyle=i%3?'#a16207':'#eab308';g.beginPath();g.arc(Math.cos(a)*r,Math.sin(a)*r,1.7,0,7);g.fill()}
  return c;
}
const SPR=PALS.map(sprite);
const glow=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d'),r=g.createRadialGradient(16,16,0,16,16,16);r.addColorStop(0,'rgba(255,240,150,1)');r.addColorStop(.35,'rgba(251,191,36,.5)');r.addColorStop(1,'rgba(251,191,36,0)');g.fillStyle=r;g.fillRect(0,0,32,32);return c})();

function mk(x,y,pl,u){return{x,y,pl,u,g:0,s:Math.max(46,Math.min(120,Math.min(W,H)*(.1+R()*.1))),v:(R()*3)|0,ph:R()*6,rot:(R()-.5)*.6}}
function init(){
  const n=Math.round(Math.max(12,Math.min(38,W/30)));
  for(let i=0;i<n;i++)flowers.push(mk((i+.5+(R()-.5)*.6)/n*W,H*(1-(.14+R()*.34)),false,R()*.72));
  flowers.sort((a,b)=>a.s-b.s);
  for(let i=0;i<70;i++)stars.push({x:R()*W,y:R()*H*.6,r:R()*1.8+.6,sp:R()*2+.5,ph:R()*6});
  for(let i=0;i<34;i++)ff.push({x:R()*W,y:H*(.35+R()*.6),a:R()*6,v:.15+R()*.35,s:14+R()*22,ph:R()*6});
}
function size(){
  const nw=innerWidth,nh=innerHeight,d=Math.min(2,devicePixelRatio||1);
  if(W)flowers.forEach(o=>{o.x*=nw/W;o.y*=nh/H});
  cv.width=nw*d;cv.height=nh*d;ctx.setTransform(d,0,0,d,0,0);
  const first=!W;W=nw;H=nh;if(first)init();
}
addEventListener('resize',size);size();

const mix=(a,b,t)=>`rgb(${a.map((v,i)=>v+(b[i]-v)*t|0)})`;
function hill(base,amp,ph,col){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H*base);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*base+Math.sin(x*.008+ph)*H*amp);ctx.lineTo(W,H);ctx.fill()}
function heart(s){const k=s/12;ctx.beginPath();ctx.moveTo(0,-3*k);ctx.bezierCurveTo(-k,-8*k,-11*k,-6*k,-9*k,k);ctx.bezierCurveTo(-7*k,6*k,-2*k,8*k,0,11*k);ctx.bezierCurveTo(2*k,8*k,7*k,6*k,9*k,k);ctx.bezierCurveTo(11*k,-6*k,k,-8*k,0,-3*k);ctx.fill()}

function drawFlower(o,t){
  const e=o.g<.999?1-(1-o.g)**3:1;if(e<.01)return;
  const hy=H+6-(H+6-o.y)*e,sw=RM?0:Math.sin(t*.0009+o.ph)*(3+(H-hy)*.025)*e,hx=o.x+sw;
  ctx.strokeStyle=mix([77,124,15],[101,163,13],light*.5);ctx.lineWidth=Math.max(2.5,o.s*.06);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(o.x,H+6);ctx.quadraticCurveTo(o.x,(H+hy)/2,hx,hy);ctx.stroke();
  const dir=o.rot>0?1:-1;ctx.fillStyle='#65a30d';ctx.save();ctx.translate(o.x+sw*.5,(H+hy)/2+(H-hy)*.12);
  ctx.beginPath();ctx.ellipse(dir*o.s*.22,-o.s*.05,o.s*.22*e,o.s*.08*e,-dir*.5,0,7);ctx.fill();ctx.restore();
  const hs=Math.max(0,(o.g-.5)/.5),sz=o.s*(hs<1?1-(1-hs)**3:1);
  if(sz>1){ctx.save();ctx.translate(hx,hy);ctx.rotate(sw*.012+o.rot);ctx.drawImage(SPR[o.v],-sz/2,-sz/2,sz,sz);ctx.restore()}
}

function draw(t,dt){
  ctx.clearRect(0,0,W,H);
  const sa=1-light;
  if(sa>.02){ctx.fillStyle='#fff';stars.forEach(s=>{ctx.globalAlpha=sa*(.3+.7*Math.abs(Math.sin(t*.001*s.sp+s.ph)));ctx.fillRect(s.x,s.y,s.r,s.r)});ctx.globalAlpha=1}
  ctx.globalCompositeOperation='lighter';
  ff.forEach(o=>{if(!RM){o.x+=Math.cos(o.a)*o.v;o.y+=Math.sin(o.a)*o.v;o.a+=(R()-.5)*.25}
    if(o.x<0)o.x=W;if(o.x>W)o.x=0;if(o.y<H*.3)o.y=H*.95;if(o.y>H)o.y=H*.4;
    ctx.globalAlpha=(.2+.6*Math.abs(Math.sin(t*.002+o.ph)))*(1-light*.5);ctx.drawImage(glow,o.x-o.s/2,o.y-o.s/2,o.s,o.s)});
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  hill(.86,.04,1,mix([38,24,70],[132,204,22],light));hill(.92,.03,3,mix([20,12,40],[77,124,15],light));
  flowers.forEach(o=>{o.g+=((fin||o.pl||prog>=o.u?1:0)-o.g)*.035;if(o.g>.998)o.g=1;drawFlower(o,t)});
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];p.vy+=p.g;p.vx*=.99;p.x+=p.vx+(p.k==0?Math.sin(t*.002+p.ph)*.6:0);p.y+=p.vy;p.rot+=p.vr;p.l-=p.d;
    if(p.l<=0||p.y>H+30){P.splice(i,1);continue}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.l);ctx.fillStyle=p.c;
    if(p.k==1)heart(p.s);else if(p.k==0){ctx.beginPath();ctx.ellipse(0,0,p.s*.45,p.s,0,0,7);ctx.fill()}
    else{ctx.beginPath();ctx.arc(0,0,p.s*.3,0,7);ctx.fill()}
    ctx.restore();
  }
}

/* ---------- Partículas y acciones ---------- */
const COL=['#facc15','#fbbf24','#f59e0b','#fde047','#fb7185','#fda4af'];
const pick=a=>a[(R()*a.length)|0];
function burst(x,y,n=110){for(let i=0;i<n;i++){const a=R()*6.283,v=3+R()*8;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.1,l:1,d:.008+R()*.012,rot:R()*6,vr:(R()-.5)*.2,s:6+R()*9,c:pick(COL),k:R()>.45?1:2,ph:0})}}
function rain(){if(muted===false)tone(f(19),.08,2);for(let i=0;i<(RM?25:85);i++)P.push({x:R()*W,y:-20-R()*H*.7,vx:(R()-.5)*.6,vy:1+R()*1.5,g:0,l:1,d:0,rot:R()*6,vr:(R()-.5)*.08,s:8+R()*10,c:pick(COL),k:0,ph:R()*6})}
function plant(x,y){flowers.push(mk(x,Math.max(H*.12,Math.min(H*.84,y)),true,0));flowers.sort((a,b)=>a.s-b.s);burst(x,y,14)}
function bloomMore(){for(let i=0;i<9;i++)plant(R()*W,H*(.15+R()*.55));chime()}
cv.addEventListener('pointerdown',e=>{if(!fin)return;plant(e.clientX,e.clientY);tone(f(PENT[(R()*8)|0]+12),.07,1.8)});

function finish(){
  const h=$('hold'),r=h?h.getBoundingClientRect():{left:W/2,top:H/2,width:0,height:0};
  fin=1;holding=0;prog=1;chime();if(navigator.vibrate)navigator.vibrate([80,50,80]);
  burst(r.left+r.width/2,r.top+r.height/2,140);setTimeout(rain,500);
  document.body.classList.add('dawn');go(5);
}

/* ---------- Mantener presionado ---------- */
document.addEventListener('pointerdown',e=>{if(e.target.closest('#hold')&&!fin)holding=1});
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,()=>holding=0));
addEventListener('keydown',e=>{if((e.code=='Space'||e.code=='Enter')&&cur==4&&!fin&&!e.repeat){holding=1;e.preventDefault()}});
addEventListener('keyup',()=>holding=0);
addEventListener('contextmenu',e=>e.preventDefault());
$('peek').onclick=()=>{const p=document.body.classList.toggle('peek');$('peek').textContent=p?'Volver a la carta 💌':'Ver el jardín 🌻'};

/* ---------- Bucle principal ---------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(50,t-last);last=t;
  if(cur==4&&!fin){
    prog=Math.max(0,Math.min(1,prog+(holding?dt/1900:-dt/1100)));
    const h=$('hold');if(h)h.style.setProperty('--p',prog);
    const n=Math.floor(prog*8);
    if(holding&&n>lastN){lastN=n;tone(f(PENT[Math.min(9,n)]),.08,1.6);if(navigator.vibrate)navigator.vibrate(12)}
    if(prog<.05)lastN=0;
    if(holding&&prog>=.999)finish();
  }
  light+=((fin?1:prog*.5)-light)*.03;$('dawn').style.opacity=light.toFixed(3);
  draw(t,dt);requestAnimationFrame(frame);
}
go(0);requestAnimationFrame(frame);
</script>
</body>
</html>
